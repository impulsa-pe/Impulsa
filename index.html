<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPULSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #050508; }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-[#0a0a0f] border border-gray-800 rounded-3xl p-6 text-white shadow-2xl">
            <div class="text-center my-8">
                <div class="text-purple-500 text-4xl mb-3">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h1 class="text-3xl font-serif italic font-bold tracking-wider mb-2">IMPULSA</h1>
                <p class="text-xs tracking-widest text-cyan-400 font-semibold uppercase">TU IDEA. TU GENTE. TU PROYECTO.</p>
            </div>
            
            <div class="space-y-3">
                <button class="w-full py-3.5 rounded-full bg-gradient-to-r from-pink-600 to-amber-500 font-medium text-white shadow-lg">
                    Comenzar
                </button>
                <button class="w-full py-3.5 rounded-full bg-transparent hover:bg-white/5 border border-gray-700 text-white font-medium flex items-center justify-center gap-2">
                    <i class="fa-brands fa-google"></i> Continuar con Google
                </button>
                <button class="w-full py-3.5 rounded-full bg-transparent hover:bg-white/5 border border-gray-700 text-white font-medium flex items-center justify-center gap-2">
                    <i class="fa-brands fa-apple"></i> Continuar con Apple
                </button>
            </div>

            <div class="text-center mt-6">
                <p class="text-xs text-gray-400">¿Ya tienes cuenta? <span class="text-pink-500 font-semibold cursor-pointer">Iniciar sesión</span></p>
            </div>
        </div>
    </div>
</body>
</html>
