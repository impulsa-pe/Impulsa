<body>

  <script>

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- Aplicación Principal en React -->
  <script type="text/babel">

            password: 'password12345'
          });
          
          if (error) {
            console.error("Error al registrar:", error.message);

          } else {
            console.log("¡Usuario registrado con éxito!", data);
            alert("¡Registro exitoso en Supabase!");
            setCurrentScreen('home');
            setActiveTab('home');
          }
        } catch (err) {
          console.error("Error inesperado:", err);
        }

      const [currentScreen, setCurrentScreen] = useState('splash');
      const [activeTab, setActiveTab] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState(null);
      
      const [userIdeaInput, setUserIdeaInput] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const [chatMessages, setChatMessages] = useState([
        { sender: 'ai', text: '¡Hola! Soy tu Asistente IA Bot de Impulsa. ¿En qué proyecto o idea te gustaría que te ayude hoy?' }
      ]);
      const [chatInput, setChatInput] = useState('');

      const [exploreFilter, setExploreFilter] = useState('Todos');
      const [searchQuery, setSearchQuery] = useState('');

      const [activeProjects, setActiveProjects] = useState([
        {
          id: 1,
          category: 'Música',
          title: 'Canción pop romántica',

          members: '3/5 miemb.',
          progress: 65,
          image: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=80'
        },
        {
          id: 2,
          category: 'Video',
          title: 'Cortometraje de amistad',
          description: 'Necesitamos 2 actores, camarógrafo y editor de video para proyecto independiente en Arequipa.',
          members: '2/6 miemb.',
          progress: 40,
          image: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&auto=format&fit=crop&q=80'
        },
        {
          id: 3,
          category: 'Negocios',
          title: 'Plataforma digital para creadores',
          description: 'Buscamos desarrolladores y expertos en marketing para lanzar la app de colaboración.',
          members: '1/4 miemb.',
          progress: 25,
          image: 'https://images.unsplash.com/photo-1553877522-43269d4ea984?w=500&auto=format&fit=crop&q=80'
        },
        {
          id: 4,
          category: 'Juegos',
          title: 'Videojuego RPG Indie 2D',
          description: 'Buscamos artistas pixel art y programadores en Unity para prototipo de juego.',
          members: '2/4 miemb.',
          progress: 50,
          image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=80'
        }
      ]);

      const [userProfile, setUserProfile] = useState({
        name: 'Percy Alcántara',
        role: 'Diseñador Gráfico • Profesor de Música',
        location: 'Lima, Perú',
        bio: 'Apasionado por la música folclórica latinoamericana, las baladas y la creación de experiencias visuales únicas.',
        avatar: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80',
        experienceLevel: 'Intermedio (Nivel 4)',
        rating: 4.8,
        totalReviews: 12,
        projectsCount: 12,
        collaboratorsCount: 48,
        followersCount: '5.6K',
        skills: [
          { name: 'Composición', bg: 'bg-gradient-to-r from-pink-600 to-purple-600' },
          { name: 'Guitarra', bg: 'bg-gradient-to-r from-amber-500 to-orange-600' },
          { name: 'Producción', bg: 'bg-gradient-to-r from-cyan-500 to-blue-600' },
          { name: 'Letra', bg: 'bg-gradient-to-r from-purple-600 to-indigo-600' },
          { name: 'Edición de audio', bg: 'bg-gradient-to-r from-blue-600 to-indigo-700' },
          { name: 'Arreglos', bg: 'bg-gradient-to-r from-fuchsia-600 to-pink-600' }
        ],
        donationsEnabled: true,
        totalDonations: 145.00,
        yapeNumber: '+51 987 654 321',
        plinNumber: '+51 987 654 321',
        bcpAccount: '193-23456789-0-12',
        paypalEmail: 'percy.alcantara@music.com'
      });

      const [editForm, setEditForm] = useState(userProfile);
      const [showDonateModal, setShowDonateModal] = useState(false);
      const [donationAmount, setDonationAmount] = useState('');
      const [donationSuccess, setDonationSuccess] = useState(false);
      const [selectedMethod, setSelectedMethod] = useState('yape');
      const [newSkillInput, setNewSkillInput] = useState('');

      const avatarOptions = [
        'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150&auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
      ];

      const experienceOptions = [
        'Principiante (Nivel 1)',
        'Junior (Nivel 2)',
        'Intermedio (Nivel 3)',
        'Avanzado / Profesional (Nivel 4)',
        'Master / Expert (Nivel 5)'
      ];

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const localUrl = URL.createObjectURL(file);
          setEditForm({...editForm, avatar: localUrl});
        }
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        setUserProfile(editForm);
        setCurrentScreen('home');
        setActiveTab('home');
      };

      const handleAddSkill = () => {
        if (!newSkillInput.trim()) return;
        const gradients = [
          'bg-gradient-to-r from-pink-600 to-purple-600',
          'bg-gradient-to-r from-amber-500 to-orange-600',
          'bg-gradient-to-r from-cyan-500 to-blue-600',
          'bg-gradient-to-r from-purple-600 to-indigo-600',
          'bg-gradient-to-r from-emerald-500 to-teal-600'
        ];
        const randomGrad = gradients[Math.floor(Math.random() * gradients.length)];
        setUserProfile(prev => ({
          ...prev,
          skills: [...prev.skills, { name: newSkillInput.trim(), bg: randomGrad }]
        }));
        setNewSkillInput('');
      };

      const handleRemoveSkill = (indexToRemove) => {
        setUserProfile(prev => ({
          ...prev,
          skills: prev.skills.filter((_, idx) => idx !== indexToRemove)
        }));
      };

      const handleSendDonation = (e) => {
        e.preventDefault();
        if(!donationAmount || isNaN(donationAmount)) return;
        const added = parseFloat(donationAmount);
        setUserProfile(prev => ({
          ...prev,
          totalDonations: prev.totalDonations + added
        }));
        setDonationSuccess(true);
        setTimeout(() => {
          setDonationSuccess(false);
          setShowDonateModal(false);
          setDonationAmount('');
        }, 2000);
      };

      const handleRunAiAnalysis = () => {
        if (!userIdeaInput.trim()) return;
        setIsAnalyzing(true);
        setAiAnalysisResult(null);

        setTimeout(() => {
          setIsAnalyzing(false);
          setAiAnalysisResult({
            summary: `"${userIdeaInput}" tiene un potencial creativo muy fuerte para el público de Lima y Latinoamérica.`,
            requirements: [
              "Arreglista musical o instrumentista de folclor/baladas",
              "Diseñador gráfico para portada en alta resolución (1920x1080)",
              "Colaborador en mezcla o producción de audio (Cubase / VST)"
            ],
            matchScore: "96% de compatibilidad con tu perfil"
          });
        }, 1500);
      };

      const handleSendChat = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const newMsg = chatInput;
        setChatMessages(prev => [...prev, { sender: 'user', text: newMsg }]);
        setChatInput('');

        setTimeout(() => {
          setChatMessages(prev => [
            ...prev, 
            { sender: 'ai', text: `Entendido sobre "${newMsg}". Como tu asistente de IA Bot, te sugiero estructurar los pasos y buscar colaboradores en la sección de explorar.` }
          ]);
        }, 1000);
      };

      const handlePublishProject = () => {
        if (!userIdeaInput.trim()) return;
        const newProj = {
          id: Date.now(),
          category: selectedCategory ? selectedCategory.label : 'General',
          title: userIdeaInput,
          description: 'Proyecto publicado recientemente con asistencia de IA.',
          members: '1/4 miemb.',
          progress: 10,
          image: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=500&auto=format&fit=crop&q=80'
        };
        setActiveProjects([newProj, ...activeProjects]);
        setUserProfile(prev => ({ ...prev, projectsCount: prev.projectsCount + 1 }));
        alert("¡Proyecto publicado con éxito en Explorar y Proyectos Activos!");
        setSelectedCategory(null);
        setAiAnalysisResult(null);
        setUserIdeaInput('');
      };

      const filteredProjects = activeProjects.filter(proj => {
        const matchesCategory = exploreFilter === 'Todos' || proj.category.toLowerCase() === exploreFilter.toLowerCase() || (exploreFilter === 'Juegos' && proj.category === 'Juegos');
        const matchesSearch = proj.title.toLowerCase().includes(searchQuery.toLowerCase()) || proj.description.toLowerCase().includes(searchQuery.toLowerCase()) || proj.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

            <div className="bg-[#050508] px-6 pt-3 pb-2 flex justify-between items-center text-xs text-slate-400 z-30 shrink-0">
              <span className="font-semibold text-slate-200">9:41</span>
              <div className="w-20 h-4 bg-slate-950 rounded-full mx-auto border border-slate-900"></div>
              <div className="flex items-center gap-1.5">
                <span className="text-[10px] font-bold text-pink-400">5G</span>
                <i className="fa-solid fa-battery-full text-slate-300"></i>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col pb-24 relative">
              
              {showDonateModal && (

                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-2 text-pink-400">
                        <i className="fa-solid fa-hand-holding-dollar text-base"></i>
                        <h3 className="text-xs font-bold text-white">Donar a {userProfile.name.split(' ')[0]}</h3>
                      </div>
                      <button onClick={() => setShowDonateModal(false)} className="text-slate-400 hover:text-white">
                        <i className="fa-solid fa-xmark text-sm"></i>
                      </button>
                    </div>

                    {donationSuccess ? (
                      <div className="py-6 text-center space-y-2">
                        <div className="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-lg">
                          <i className="fa-solid fa-check"></i>
                        </div>
                        <h4 className="text-xs font-bold text-white">¡Gracias por tu apoyo!</h4>
                        <p className="text-[10px] text-slate-400">Tu donación ayuda a continuar con sus proyectos creativos.</p>
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <p className="text-[10px] text-slate-300">Elige el método de pago de tu preferencia:</p>
                        
                        <div className="grid grid-cols-4 gap-1 bg-[#0a0c14] p-1 rounded-xl border border-slate-800 text-[10px] font-bold text-center">
                          <button onClick={() => setSelectedMethod('yape')} className={`py-1.5 rounded-lg transition-all ${selectedMethod === 'yape' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>Yape</button>
                          <button onClick={() => setSelectedMethod('plin')} className={`py-1.5 rounded-lg transition-all ${selectedMethod === 'plin' ? 'bg-sky-500 text-white' : 'text-slate-400'}`}>Plin</button>
                          <button onClick={() => setSelectedMethod('bcp')} className={`py-1.5 rounded-lg transition-all ${selectedMethod === 'bcp' ? 'bg-blue-700 text-white' : 'text-slate-400'}`}>BCP</button>
                          <button onClick={() => setSelectedMethod('paypal')} className={`py-1.5 rounded-lg transition-all ${selectedMethod === 'paypal' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>PayPal</button>

                          <span className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Datos de {selectedMethod.toUpperCase()}</span>
                          <p className="text-xs font-bold text-pink-400">
                            {selectedMethod === 'yape' && (userProfile.yapeNumber || 'No configurado')}
                            {selectedMethod === 'plin' && (userProfile.plinNumber || 'No configurado')}

                              value={donationAmount}
                              onChange={(e) => setDonationAmount(e.target.value)}
                              className="w-full bg-[#0a0c14] border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-pink-500"

                            Registrar Donación Realizada
                          </button>
                        </form>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {selectedCategory && (
                <div className="absolute inset-0 bg-[#050508] z-40 p-5 flex flex-col justify-between">
                  <div className="space-y-4 overflow-y-auto no-scrollbar pb-4">
                    <div className="flex items-center justify-between">
                      <button 
                        onClick={() => { setSelectedCategory(null); setAiAnalysisResult(null); setUserIdeaInput(''); }}

                      >
                        <i className="fa-solid fa-arrow-left text-xs"></i>
                      </button>
                      <h2 className="text-sm font-bold text-white">Detalle de Proyecto</h2>
                      <div className="w-9"></div>
                    </div>

                    <div className="p-4 rounded-3xl bg-gradient-to-br from-pink-500/15 via-purple-600/15 to-[#121622] border border-pink-500/30 text-center space-y-2">
                      <div className="w-14 h-14 rounded-2xl bg-pink-500/20 border border-pink-500/40 flex items-center justify-center mx-auto text-pink-400 text-xl shadow-lg">
                        <i className={`fa-solid ${selectedCategory.icon}`}></i>
                      </div>
                      <h3 className="text-base font-black text-white">{selectedCategory.label}</h3>
                      <p className="text-[11px] text-slate-300 leading-relaxed">
                        Cuéntanos los detalles. La Inteligencia Artificial analizará tu propuesta para darte recomendaciones de equipo y colaboradores ideales.
                      </p>
                    </div>

                    <div className="space-y-2">
                      <label className="text-xs font-semibold text-slate-400">Describe tu idea en detalle:</label>
                      <textarea 
                        rows="3"
                        value={userIdeaInput}
                        onChange={(e) => setUserIdeaInput(e.target.value)}
                        placeholder="Ej. Quiero componer una balada folclórica y necesito portada y arreglos..."
                        className="w-full bg-[#121622] border border-slate-800 rounded-2xl p-3 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"
                      ></textarea>

                      <button 
                        onClick={handleRunAiAnalysis}
                        disabled={isAnalyzing || !userIdeaInput.trim()}
                        className="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-xs shadow-md shadow-purple-500/25 flex items-center justify-center gap-2 disabled:opacity-50 transition-all"
                      >
                        {isAnalyzing ? (
                          <>
                            <i className="fa-solid fa-spinner animate-spin"></i> Analizando con IA Gemini...
                          </>
                        ) : (
                          <>
                            <i className="fa-solid fa-wand-magic-sparkles"></i> Analizar Idea con IA
                          </>
                        )}
                      </button>
                    </div>

                    {aiAnalysisResult && (
                      <div className="p-4 rounded-2xl bg-[#121622] border border-purple-500/40 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-bold text-purple-400 uppercase tracking-wider flex items-center gap-1">
                            <i className="fa-solid fa-robot"></i> Resultado de IA Gemini
                          </span>
                          <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-[10px] text-emerald-400 font-bold">
                            {aiAnalysisResult.matchScore}
                          </span>
                        </div>
                        <p className="text-xs text-slate-200 italic">
                          {aiAnalysisResult.summary}
                        </p>
                        <div className="space-y-1 pt-1 border-t border-slate-800">
                          <span className="text-[10px] font-bold text-slate-400">Talentos / Recursos recomendados:</span>
                          <ul className="space-y-1">
                            {aiAnalysisResult.requirements.map((req, idx) => (
                              <li key={idx} className="text-[11px] text-slate-300 flex items-center gap-2">
                                <i className="fa-solid fa-check text-pink-400 text-[10px]"></i> {req}
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    )}
                  </div>

                  <button 
                    onClick={handlePublishProject}
                    className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-sm shadow-lg shadow-pink-500/25 mt-2"
                  >
                    Publicar Proyecto y Conectar
                  </button>
                </div>
              )}

              {currentScreen === 'splash' && (
                <div className="flex-1 flex flex-col justify-end p-6 relative overflow-hidden bg-[#050508] min-h-[750px]">
                  <div className="absolute inset-0 pointer-events-none">
                    <div className="absolute inset-0 bg-gradient-to-t from-[#050508] via-[#050508]/80 to-transparent z-10"></div>
                    <div className="absolute top-0 inset-x-0 h-96 bg-gradient-to-b from-purple-900/20 via-pink-600/10 to-transparent"></div>
                    
                    <div className="absolute bottom-24 inset-x-0 h-64 opacity-60 flex items-end justify-center z-0">
                      <div className="w-full h-full bg-[radial-gradient(ellipse_at_bottom,_var(--tw-gradient-stops))] from-pink-500/30 via-purple-600/10 to-transparent blur-xl"></div>
                      <div className="absolute bottom-0 w-full flex justify-around items-end px-2">
                        <div className="w-20 h-32 bg-slate-900 rounded-t-full opacity-80"></div>
                        <div className="w-16 h-40 bg-slate-900 rounded-t-full opacity-90 relative"></div>
                        <div className="w-24 h-48 bg-slate-900 rounded-t-full opacity-95"></div>
                        <div className="w-20 h-36 bg-slate-900 rounded-t-full opacity-90"></div>
                        <div className="w-16 h-44 bg-slate-900 rounded-t-full opacity-90 relative"></div>
                        <div className="w-20 h-32 bg-slate-900 rounded-t-full opacity-80"></div>
                      </div>
                    </div>
                  </div>

                  <div className="relative z-20 flex flex-col items-center text-center mt-12 mb-6">
                    <div className="w-24 h-24 relative mb-2 flex items-center justify-center filter drop-shadow-[0_0_20px_rgba(236,72,153,0.5)]">
                      <i className="fa-solid fa-bolt text-6xl bg-gradient-to-r from-pink-500 via-purple-500 to-amber-400 bg-clip-text text-transparent"></i>
                    </div>
                    <h1 className="text-5xl font-black italic tracking-wider text-white font-serif drop-shadow-md">IMPULSA</h1>
                    <p className="text-[11px] font-bold tracking-[0.1em] mt-1.5">
                      <span className="text-amber-400">TU IDEA.</span> <span className="text-white">TU GENTE.</span> <span className="text-cyan-400">TU PROYECTO.</span>
                    </p>
                  </div>

                  <div className="relative z-20 space-y-3 pb-6">
                    {/* BOTÓN CONECTADO A SUPABASE */}

                                className="w-full bg-[#0a0c14] border border-slate-800 rounded-lg px-2.5 py-1 text-[11px] text-white focus:outline-none focus:border-pink-500 mt-0.5"
                              />
                            </div>
                            <div>
                              <label className="text-[9px] text-slate-400 font-semibold">Número Plin</label>
                              <input 
                                type="text"
                                placeholder="+51 ..."
                                value={editForm.plinNumber}
                                onChange={(e) => setEditForm({...editForm, plinNumber: e.target.value})}
                                className="w-full bg-[#0a0c14] border border-slate-800 rounded-lg px-2.5 py-1 text-[11px] text-white focus:outline-none focus:border-pink-500 mt-0.5"
                              />
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="space-y-1">
                      <label className="text-[11px] font-semibold text-slate-400">Biografía</label>
                      <textarea 
                        rows="2"
                        value={editForm.bio}
                        onChange={(e) => setEditForm({...editForm, bio: e.target.value})}
                        className="w-full bg-[#121622] border border-slate-800 rounded-xl p-2 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"
                      ></textarea>
                    </div>

                    <div className="mt-auto pt-2 pb-1">
                      <button 
                        type="submit"
                        className="w-full py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-sm shadow-lg shadow-pink-500/25"
                      >
                        Guardar Cambios
                      </button>
                    </div>
                  </form>
                </div>
              )}

            </div>

            {currentScreen === 'home' && (
              <div className="bg-[#0b0d14] border-t border-slate-800/80 px-4 py-2.5 flex justify-between items-center absolute bottom-0 left-0 right-0 z-40">
                <button onClick={() => { setActiveTab('home'); setSelectedCategory(null); }} className={`flex flex-col items-center gap-1 text-[9px] ${activeTab === 'home' && !selectedCategory ? 'text-pink-500' : 'text-slate-500'}`}>
                  <i className="fa-solid fa-house text-sm"></i>
                  <span>Inicio</span>
                </button>
                <button onClick={() => { setActiveTab('explore'); setSelectedCategory(null); }} className={`flex flex-col items-center gap-1 text-[9px] ${activeTab === 'explore' ? 'text-pink-500' : 'text-slate-500'}`}>
                  <i className="fa-solid fa-compass text-sm"></i>
                  <span>Explorar</span>
                </button>
                <button onClick={() => setSelectedCategory({ icon: 'fa-music', label: 'Nuevo Proyecto' })} className="w-11 h-11 rounded-full bg-gradient-to-tr from-pink-500 to-purple-600 text-white flex items-center justify-center -mt-6 shadow-lg shadow-pink-500/40">
                  <i className="fa-solid fa-plus text-base"></i>
                </button>
                <button onClick={() => { setActiveTab('ai_bot'); setSelectedCategory(null); }} className={`flex flex-col items-center gap-1 text-[9px] ${activeTab === 'ai_bot' ? 'text-pink-500' : 'text-slate-500'}`}>
                  <i className="fa-solid fa-robot text-sm"></i>
                  <span>IA Bot</span>
                </button>
                <button onClick={() => { setActiveTab('profile'); setSelectedCategory(null); }} className={`flex flex-col items-center gap-1 text-[9px] ${activeTab === 'profile' ? 'text-pink-500' : 'text-slate-500'}`}>
                  <i className="fa-solid fa-user text-sm"></i>
                  <span>Perfil</span>
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
